# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng. Dùng khi (1) thiếu một argument bắt buộc cho tool khác (ví dụ: không biết handle/username, không có URL), hoặc (2) trước khi thực hiện một hành động nhạy cảm/không thể hoàn tác như gửi hoặc đăng nội dung ra bên ngoài — khi đó dùng response_type='yes_no' và chỉ tiếp tục hành động đó sau khi người dùng xác nhận 'có'. Không dùng cho các câu hỏi ngoài phạm vi nghiên cứu (toán, code, chit-chat) — những câu đó trả lời trực tiếp, không cần tool."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây CỦA một tài khoản social media cụ thể (screenname/handle đã biết, ví dụ 'sama'). Chỉ dùng khi biết chính xác handle; nếu user nói tên người nhưng không rõ handle và bạn không chắc, dùng clarify trước, không tự đoán."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle tài khoản, không có dấu @ (ví dụ: 'sama', 'OpenAI')"}
        limit: {type: integer, default: 5, description: "Số bài muốn lấy"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng trên mạng xã hội theo từ khóa (khác với timeline: dùng khi tìm theo CHỦ ĐỀ, không phải theo một tài khoản cụ thể)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "CHỈ chứa từ khóa chủ đề cốt lõi (ví dụ 'AI', không phải 'AI news' hay 'tin tức AI'). Không nhét các từ mô tả loại nội dung hay thời gian vào đây — dùng search_type/limit cho việc đó."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tìm trên web (không phải mạng xã hội)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "CHỈ chứa từ khóa chủ đề cốt lõi (ví dụ 'AI', không phải 'AI news' hay 'tin AI hôm nay'). Ý định 'tin tức'/'mới nhất' thể hiện qua topic và timeframe, không nhét vào query."}
        topic: {type: string, enum: [general, news], default: "general", description: "Đặt 'news' khi user hỏi tin tức/sự kiện gần đây (ví dụ có từ 'tin', 'tin tức', 'mới nhất', 'hôm nay'); 'general' cho tra cứu thông tin thông thường."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian; đặt 'day' khi user nói 'hôm nay'."}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung đầy đủ của một URL cụ thể đã biết. Không dùng khi user chỉ nhắc mơ hồ đến 'bài viết này' mà không cung cấp URL — khi đó dùng clarify để hỏi URL trước."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL đầy đủ, ví dụ 'https://example.com/article'"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản lên Telegram — hành động không thể hoàn tác. BẮT BUỘC gọi clarify (response_type='yes_no') để xác nhận với user trước, chỉ gọi send sau khi user đã đồng ý."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Chỉ đặt true sau khi user đã xác nhận đồng ý qua clarify"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
